# byjg/easyhaproxy

# One copy only: each replica runs its own ACME (Let's Encrypt) client, so
# challenges reach the wrong replica and certificates fail. See the README.
replicaCount: 1

service:
  create: true
  type: LoadBalancer

persistence:
  certbot:
    enabled: true
    size: 1Gi

easyhaproxy:
  stats:
    # The Load Balancer would expose them to the internet; see the README to enable them
    enabled: false

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
