# Traefik Helm Chart Configuration
# https://github.com/traefik/traefik-helm-chart

# Ingress configuration
ingressRoute:
  dashboard:
    enabled: true
  # https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml#L240, modify the entrypoint to access dashboard

# Service configuration
service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-type: "REGIONAL_NETWORK"

# Deployment configuration
deployment:
  replicas: null

# Auto scaling configuration
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80

# Resource limits
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

# Security settings
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
