# lockdep/stackradar — oci://ghcr.io/lockdep/helm-charts/stackradar
#
# The chart's defaults are the install: the server, the UI, a bundled
# PostgreSQL 18 (10Gi do-block-storage volume) and the scanner, reached by
# port-forward. Requests total about 0.6 vCPU and 2 GiB, which fits one
# 2 vCPU / 4 GB node. Secrets are generated by deploy.sh at install time,
# not set here. The full values reference:
# https://github.com/lockdep/helm-charts/blob/main/charts/stackradar/README.md
