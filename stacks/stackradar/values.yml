# lockdep/stackradar — oci://ghcr.io/lockdep/helm-charts/stackradar
#
# The chart's defaults are the install: the server, the UI, a bundled
# PostgreSQL 18 (one 10Gi volume from the cluster's default StorageClass,
# do-block-storage on DOKS) and the scanner, reached by port-forward.
# Requests total 0.5 vCPU and 2.25 GiB, which fits one 2 vCPU / 4 GB node.
# Secrets are generated by deploy.sh into the Secret stackradar-credentials,
# not set here. The full values reference:
# https://github.com/lockdep/helm-charts/blob/main/charts/stackradar/README.md
